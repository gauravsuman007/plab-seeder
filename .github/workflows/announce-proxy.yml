name: announce-proxy

on:
  push:
    branches: [main]
    paths:
      - announce-proxy/**
      - .github/workflows/announce-proxy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r announce-proxy/requirements.txt pytest
      - run: pytest announce-proxy/tests -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: announce-proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plab-announce-proxy:latest
            ghcr.io/${{ github.repository_owner }}/plab-announce-proxy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
