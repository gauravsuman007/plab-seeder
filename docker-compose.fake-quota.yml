# Lean, qBittorrent-free mode: fake-upload-quota reporting with a web UI.
#
# No qBittorrent, no gateway/tailscale. Runs the same image as the full
# app but with a different entrypoint (app/standalone.py instead of
# app/main.py). Provides a minimal web UI to log in to PornoLab and
# monitor the announce/profile status. See app/standalone.py for the
# full description of what this mode does and doesn't do.
#
# This is independent of, and can run alongside, the full seeder stacks --
# give it a different PornoLab account and a separate data directory.
#
# Deploy with: docker compose -f docker-compose.fake-quota.yml up -d
# Web UI: http://<host>:8050
services:
  pornolab-fake-quota:
    image: ghcr.io/gauravsuman007/plab-seeder:latest
    container_name: pornolab-fake-quota
    command: ["uvicorn", "app.standalone:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATA_DIR: /data
      PORNOLAB_URL: ${PORNOLAB_URL:-https://pornolab.net}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Candidate selection for the one bootstrap download.
      SCAN_PAGES: ${SCAN_PAGES:-3}
      SCAN_ORDER: ${SCAN_ORDER:-11}
      MIN_LEECHERS: ${MIN_LEECHERS:-1}
      MIN_SIZE_MB: ${MIN_SIZE_MB:-20}
      MAX_SIZE_MB: ${MAX_SIZE_MB:-1024}
      # Fake upload/download reporting.
      FAKE_UPLOAD_MB_PER_HOUR: ${FAKE_UPLOAD_MB_PER_HOUR:-250}
      ANNOUNCE_INTERVAL_S: ${ANNOUNCE_INTERVAL_S:-1800}
      BOOTSTRAP_CHECK_INTERVAL_S: ${BOOTSTRAP_CHECK_INTERVAL_S:-300}
    volumes:
      - ./data/fake-quota:/data
    ports:
      - "${FAKE_QUOTA_PORT:-8050}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6
