# Seeder + qBittorrent in one stack, for hosts without the vpngate gateway.
# qBittorrent stays usable for ordinary downloads; the seeder only manages
# torrents in its own category.
#
#   docker compose -f docker-compose.standalone.yml up -d --build
#   seeder UI:       http://<host>:8010
#   qBittorrent UI:  http://<host>:8080
#
# Tailscale is bundled and optional (see app/tailscale.py + the Settings
# tab). With no exit node selected, or not logged in at all, egress is the
# ordinary network -- identical to leaving tailscale out entirely. Because
# qBittorrent shares the tailscale sidecar's network namespace here, picking
# an exit node from the UI routes BOTH the app's and qBittorrent's traffic
# through it.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-pornolab-seeder
    hostname: pornolab-seeder
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      # This node only ever consumes someone else's exit node; it never
      # advertises itself as one or as a subnet router, so it doesn't need
      # tailscaled's own nftables rules -- which otherwise conflict with
      # Docker's own port publishing for every container sharing this
      # netns (confirmed live: published ports became unreachable from
      # outside the container until this was set, even though everything
      # worked from inside it).
      TS_EXTRA_ARGS: "--netfilter-mode=off"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "${SEEDER_PORT:-8010}:8000"
      - "${QBIT_WEBUI_PORT:-8080}:8080"
      - "${QBIT_PEER_PORT:-6881}:6881"
      - "${QBIT_PEER_PORT:-6881}:6881/udp"
    restart: unless-stopped
    healthcheck:
      # Socket existing proves tailscaled booted and is listening --
      # deliberately NOT `tailscale status`, which exits 1 whenever the
      # node isn't logged in yet (confirmed live), and "not logged in" is
      # a normal, supported state here, not a failure.
      test: ["CMD", "test", "-S", "/var/run/tailscale/tailscaled.sock"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: 8080
    volumes:
      - ./qbit-config:/config
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
      - ./deploy/qbit-init/10-whitelist:/custom-cont-init.d/10-whitelist:ro
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped

  pornolab-seeder:
    build: .
    image: pornolab-seeder:latest
    container_name: pornolab-seeder
    environment:
      DATA_DIR: /data
      # qBittorrent shares this container's network namespace (both are
      # network_mode: service:tailscale), so it's reachable over loopback.
      QBIT_URL: http://localhost:8080
      # qBittorrent announces through this address, so it must resolve from
      # inside the qbittorrent container -- also loopback, same reasoning.
      SELF_URL: http://localhost:8000
      APP_PASSWORD: ${APP_PASSWORD:-}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - ./data:/data
      - tailscale-socket:/var/run/tailscale:ro
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  tailscale-state:
  tailscale-socket:
