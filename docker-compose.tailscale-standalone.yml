# A fully standalone stack: its own tailscale + qBittorrent, with no
# dependency on (or connection to) the vpngate-torrent project's network,
# gateway, or qBittorrent instance. Unrelated to docker-compose.tailscale.yml,
# which is a tailscale *overlay* for the vpngate-connected deployment (see
# that file's own header) -- this one is a separate, independent deployment
# of the whole app on its own network, meant to live in its own directory
# (e.g. /home/hellonfire/Server/pornolab-seeder-tscale).
#
# Host ports default to 8030/8091/8882 specifically to avoid colliding with
# the vpngate-torrent stack's 8010/8080/8081 and the plab-register stack's
# 8020 when all run on the same host.
#
# Deploy with: docker compose -f docker-compose.tailscale-standalone.yml up -d
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: pornolab-seeder-tscale-ts
    hostname: ${TS_HOSTNAME:-pornolab-seeder-tscale}
    environment:
      # Set TS_AUTHKEY in .env for an unattended join. Left empty, the
      # container logs a one-time login URL on first start (`docker logs
      # pornolab-seeder-tscale-ts`) -- open it yourself to authorize the
      # device; nothing here needs a password.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # --netfilter-mode=off: tailscaled's own nftables rules otherwise
      # conflict with Docker's port publishing for every container sharing
      # this netns -- confirmed live (same issue, same fix, as
      # docker-compose.tailscale.yml's identically-named comment): qbit's
      # WebUI port was reachable from inside the container but reset the
      # connection from outside until this was set. This node also never
      # advertises itself as an exit node or subnet router, so it doesn't
      # need those nftables rules for anything.
      #
      # To additionally route qBittorrent's own torrent traffic through
      # another device on your tailnet (e.g. a VPS with a cleaner IP), add
      # --exit-node=<name-or-ip> here too -- but see
      # docker-compose.tailscale.yml's own TS_EXTRA_ARGS comment first: a
      # selected exit node is a non-default pref that crashes the container
      # on every restart unless --reset is also added, the same issue that
      # file already works around.
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---netfilter-mode=off}
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      # qBittorrent shares this container's network stack (see below), so
      # its ports are published here.
      - "${QBIT_WEBUI_PORT:-8091}:8080"
      - "${QBIT_TORRENT_PORT:-8882}:6881/tcp"
      - "${QBIT_TORRENT_PORT:-8882}:6881/udp"
    networks:
      pornolab_tscale:
        ipv4_address: 192.168.208.2
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: pornolab-seeder-tscale-qbit
    # Shares the tailscale container's network namespace -- the same
    # pattern the vpngate-torrent stack uses for its own gateway/qbit pair.
    network_mode: service:tailscale
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ./data/qbittorrent:/config
      - ./downloads:/downloads
    depends_on:
      - tailscale
    restart: unless-stopped

  pornolab-seeder:
    image: ghcr.io/gauravsuman007/plab-seeder:latest
    container_name: pornolab-seeder-tscale
    environment:
      DATA_DIR: /data
      # qbittorrent is reached at the tailscale service's address, since it
      # shares that container's network stack.
      QBIT_URL: ${QBIT_URL:-http://tailscale:8080}
      # No tunnel-supervisor control API in this standalone stack (that's a
      # vpngate-torrent-specific thing) -- left unset so the dashboard's
      # gateway panel just reports unavailable instead of pointing at
      # something that doesn't exist here.
      GATEWAY_URL: ${GATEWAY_URL:-}
      # Pinned to a static IP rather than the "pornolab-seeder" hostname:
      # Docker's embedded DNS has been observed to silently stop resolving
      # a container's own compose-network hostname to its peers (see
      # docker-compose.yml's own SELF_URL comment for the 2026-10-12
      # incident this sidesteps from the start).
      SELF_URL: ${SELF_URL:-http://192.168.208.10:8000}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Optional external announce proxy (the announce-proxy container): its announce-port URL and
      # this client's key from its Clients tab. Blank = use this app's built-in proxy.
      ANNOUNCE_PROXY_URL: ${ANNOUNCE_PROXY_URL:-}
      ANNOUNCE_PROXY_KEY: ${ANNOUNCE_PROXY_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data/seeder:/data
    ports:
      - "${SEEDER_PORT:-8030}:8000"
    networks:
      pornolab_tscale:
        ipv4_address: 192.168.208.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

  # This stack's own announce proxy (repo gauravsuman007/plab-ann-proxy, prebuilt multi-arch image).
  # Point the seeder at it with ANNOUNCE_PROXY_URL=http://192.168.208.20:8101 and
  # ANNOUNCE_PROXY_KEY from its dashboard's Clients tab (UI on host port ${UI_HOST_PORT:-8122}, keep it private).
  announce-proxy:
    image: ghcr.io/gauravsuman007/plab-ann-proxy:latest
    container_name: pornolab-seeder-tscale-announce-proxy
    environment:
      DATA_DIR: /data
      ANNOUNCE_PORT: 8101
      UI_PORT: 8102
      UI_PASSWORD: ${UI_PASSWORD:-}
    volumes:
      - ./data/announce-proxy:/data
    ports:
      - "${ANNOUNCE_HOST_PORT:-8121}:8101"
      - "${UI_HOST_PORT:-8122}:8102"
    networks:
      pornolab_tscale:
        # Static, so torrents already carrying this address keep announcing after a redeploy.
        ipv4_address: 192.168.208.20
    restart: unless-stopped

networks:
  # A standalone bridge, unrelated to the vpngate-torrent project's network
  # -- this stack doesn't join or depend on it.
  pornolab_tscale:
    name: pornolab-seeder-tscale_default
    ipam:
      config:
        - subnet: 192.168.208.0/24
