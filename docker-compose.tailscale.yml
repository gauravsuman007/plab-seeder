# Opt-in tailscale overlay: qBittorrent stays wherever it already is
# (reached over QBIT_URL/GATEWAY_URL, same as the default deployment), only
# this app's own outbound traffic can be routed through a tailscale exit
# node. Registration/camoufox lives in the separate plab-register service
# now, which has its own independent tailscale sidecar -- see that repo.
#
# This is a full replacement for docker-compose.yml, not a layer on top of
# it -- network_mode: service:X and a service's own ports/networks can't
# both be set, and compose merges list-type keys across -f files rather
# than letting a later file clear them, so stacking this on the base file
# would conflict. Deploy with:
#
#   docker compose -f docker-compose.tailscale.yml -f docker-compose.override.yml up -d
#
# With no exit node selected (or not logged in at all), egress is the
# ordinary network, identical to the non-tailscale deployment -- tailscale
# only changes routing once an exit node is actively set from the UI.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-pornolab-seeder
    hostname: pornolab-seeder
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      # This node only ever consumes someone else's exit node; it never
      # advertises itself as one or as a subnet router, so it doesn't need
      # tailscaled's own nftables rules -- which otherwise conflict with
      # Docker's own port publishing for every container sharing this
      # netns (confirmed live: published ports became unreachable from
      # outside the container until this was set, even though everything
      # worked from inside it).
      #
      # --reset: once an exit node is selected (via the app's own `tailscale
      # set --exit-node=...`), that choice is a persisted, non-default pref.
      # On the NEXT boot, containerboot runs its own `tailscale up` with only
      # the flags listed here -- not the exit node -- and the CLI refuses to
      # proceed unless every non-default pref is restated, crashing the
      # whole container on every single startup (confirmed live 2026-10-11,
      # right after a host reboot: "Error: changing settings via 'tailscale
      # up' requires mentioning all non-default flags" followed by
      # SIGTERM-and-retry forever). --reset clears prior prefs before
      # applying just these flags, so boot always succeeds -- the tradeoff
      # is a selected exit node does not survive a container restart and
      # must be reselected from the UI.
      TS_EXTRA_ARGS: "--reset --netfilter-mode=off"
      # Without this, containerboot gives up waiting for interactive

      # login approval after its default boot timeout and kills tailscaled,

      # which the restart policy then retries forever -- a crash loop that

      # tears down this container's shared network namespace every ~60s

      # and was the real cause of intermittent published-port failures for

      # the app/qbit containers sharing it (confirmed live via docker events:

      # RestartCount climbing once a minute, 'tailscale up failed: context

      # deadline exceeded' in the logs). Unlogged-in is a normal, supported

      # state here (see the healthcheck above), so this container should sit

      # and wait, not restart.

      TS_BOOT_TIMEOUT: "87600h"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - vpngate
      - ipv6
    ports:
      - "${SEEDER_PORT:-8010}:8000"
    restart: unless-stopped
    healthcheck:
      # Socket existing proves tailscaled booted and is listening --
      # deliberately NOT `tailscale status`, which exits 1 whenever the
      # node isn't logged in yet (confirmed live), and "not logged in" is
      # a normal, supported state here, not a failure.
      test: ["CMD", "test", "-S", "/var/run/tailscale/tailscaled.sock"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  pornolab-seeder:
    image: ghcr.io/gauravsuman007/plab-seeder:latest
    container_name: pornolab-seeder
    environment:
      DATA_DIR: /data
      QBIT_URL: ${QBIT_URL:-http://gateway:8080}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8081}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Optional external announce proxy (the announce-proxy container): its announce-port URL and
      # this client's key from its Clients tab. Blank = use this app's built-in proxy.
      ANNOUNCE_PROXY_URL: ${ANNOUNCE_PROXY_URL:-}
      ANNOUNCE_PROXY_KEY: ${ANNOUNCE_PROXY_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      # Selecting an exit node replaces the shared netns's default route
      # with one via tailscale0, which also swallows return traffic for
      # inbound WebUI connections from this subnet -- app/tailscale.py
      # re-pins an explicit route for it via the original gateway once an
      # exit node is set (same fix as plab-register's). Set to the subnet
      # the WebUI is actually reached from; leave unset to skip it.
      LAN_CIDR: ${LAN_CIDR:-}
    volumes:
      - ./data:/data
      - tailscale-socket:/var/run/tailscale:ro
    network_mode: "service:tailscale"
    # Needed for the `ip route` call above -- it runs in the shared netns,
    # but capabilities are per-container, not per-netns.
    cap_add:
      - NET_ADMIN
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  tailscale-state:
  tailscale-socket:

networks:
  vpngate:
    name: vpngate-torrent_default
    external: true
  ipv6:
    enable_ipv6: true
