# Server-deploy variant of docker-compose.standalone.yml -- uses the
# published image instead of `build: .` (the repo isn't checked out on the
# server), with distinct container names/ports so it runs alongside the
# existing pornolab-seeder stack without conflicting.
#
#   docker compose -p plab-seeder-tscale -f docker-compose.tscale-server.yml up -d
#
# UI:        http://<host>:8011
# qBit WebUI: http://<host>:8012  (peer port 6882)
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: plab-seeder-tscale-ts
    hostname: plab-seeder-tscale
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      # This node only ever consumes someone else's exit node; it never
      # advertises itself as one or as a subnet router, so it doesn't need
      # tailscaled's own nftables rules -- which otherwise conflict with
      # Docker's own port publishing for every container sharing this
      # netns (confirmed live: published ports became unreachable from
      # outside the container until this was set, even though everything
      # worked from inside it).
      TS_EXTRA_ARGS: "--netfilter-mode=off"
      # Without this, containerboot gives up waiting for interactive login
      # approval after its default boot timeout and kills tailscaled, which
      # the restart policy then retries forever -- a crash loop that tears
      # down this container's shared network namespace every ~60s and was
      # the real cause of intermittent published-port failures for the
      # app/qbit containers sharing it (confirmed live via docker events:
      # RestartCount climbing once a minute, 'tailscale up failed: context
      # deadline exceeded' in the logs). Unlogged-in is a normal, supported
      # state here (see the healthcheck above), so this container should
      # sit and wait, not restart.
      TS_BOOT_TIMEOUT: "87600h"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8011:8000"
      - "8012:8080"
      - "6882:6881"
      - "6882:6881/udp"
    restart: unless-stopped
    healthcheck:
      # Socket existing proves tailscaled booted and is listening --
      # deliberately NOT `tailscale status`, which exits 1 whenever the
      # node isn't logged in yet (confirmed live), and "not logged in" is
      # a normal, supported state here, not a failure.
      test: ["CMD", "test", "-S", "/var/run/tailscale/tailscaled.sock"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: plab-seeder-tscale-qbit
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      WEBUI_PORT: 8080
    volumes:
      - ./qbit-config:/config
      - ./downloads:/downloads
      - ./qbit-init/10-whitelist:/custom-cont-init.d/10-whitelist:ro
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped

  pornolab-seeder:
    image: ghcr.io/gauravsuman007/plab-seeder:latest
    container_name: plab-seeder-tscale-app
    environment:
      DATA_DIR: /data
      QBIT_URL: http://localhost:8080
      SELF_URL: http://localhost:8000
      APP_PASSWORD: ${APP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      # Shares this stack's netns (below), so the camoufox browser that
      # drives Tuta/registration signup also egresses through whatever
      # exit node is selected -- unlike the main stack's turnstile-solver,
      # which sits on its own network and never sees tailscale routing.
      TURNSTILE_SIDECAR_URL: http://localhost:8193
    volumes:
      - ./data:/data
      - tailscale-socket:/var/run/tailscale:ro
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

  turnstile-solver:
    image: ghcr.io/gauravsuman007/camoufox-turnstile-solver:latest
    container_name: plab-seeder-tscale-turnstile
    # The image hardcodes `uvicorn ... --port 8000`, but port 8000 in this
    # shared netns is already taken by pornolab-seeder's own uvicorn --
    # override the command to bind 8193 instead of colliding.
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8193"]
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8193/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  tailscale-state:
  tailscale-socket:
