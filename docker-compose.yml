services:
  pornolab-seeder:
    build: .
    image: pornolab-seeder:latest
    container_name: pornolab-seeder
    environment:
      DATA_DIR: /data
      # Defaults already point at the vpngate-torrent gateway's hostname on
      # the shared network below; override here only if that changes.
      QBIT_URL: ${QBIT_URL:-http://gateway:8080}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8081}
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - ./data:/data
    ports:
      - "${SEEDER_PORT:-8010}:8000"
    networks:
      - vpngate
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

networks:
  # Join the vpngate-torrent project's network so "gateway" resolves to the
  # VPN gateway container (which publishes qBittorrent's WebUI).
  vpngate:
    name: vpngate-torrent_default
    external: true
