services:
  pornolab-seeder:
    image: ghcr.io/gauravsuman007/plab-seeder:latest
    container_name: pornolab-seeder
    environment:
      DATA_DIR: /data
      # Defaults already point at the vpngate-torrent gateway's hostname on
      # the shared network below; override here only if that changes.
      QBIT_URL: ${QBIT_URL:-http://gateway:8080}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8081}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "${SEEDER_PORT:-8010}:8000"
    networks:
      - vpngate
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

networks:
  # Join the vpngate-torrent project's network so "gateway" resolves to the
  # VPN gateway container (which publishes qBittorrent's WebUI).
  vpngate:
    name: vpngate-torrent_default
    external: true
  # No longer used by this service -- registration (which needed IPv6 to
  # reach Cloudflare Turnstile's per-challenge subdomain) moved to the
  # separate plab-register service. Still defined here because the live
  # deployment's docker-compose.override.yml attaches the now-obsolete
  # turnstile-solver sidecar to it; remove this once that override is
  # retired (after plab-register is confirmed working).
  ipv6:
    enable_ipv6: true
