services:
  pornolab-seeder:
    image: ghcr.io/gauravsuman007/plab-seeder:latest
    container_name: pornolab-seeder
    environment:
      DATA_DIR: /data
      # Defaults already point at the vpngate-torrent gateway's hostname on
      # the shared network below; override here only if that changes.
      QBIT_URL: ${QBIT_URL:-http://gateway:8080}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8081}
      # qBittorrent's network namespace (shared with vpngate-gateway) has
      # repeatedly lost the ability to resolve this container's own
      # compose-network hostname via Docker's embedded DNS (127.0.0.11),
      # even while both containers stay correctly joined to the same network
      # -- confirmed by reaching this container's IP directly while its name
      # returned NXDOMAIN. That hostname is what every torrent's tracker URL
      # is minted against (see app/main.py's announce_proxy), so when it
      # breaks, every newly-added torrent silently gets 0 peers forever: qBit
      # can't even announce. Pin a static IP below (ipv4_address) and point
      # SELF_URL at it instead of the hostname, so new downloads don't depend
      # on that DNS path at all. If this breaks again, the symptom is stuck
      # downloads at 0 peers with "Host not found" in the torrent's tracker
      # status -- check `docker exec vpngate-gateway getent hosts
      # pornolab-seeder` to confirm, and see the 2026-10-12 incident notes.
      SELF_URL: ${SELF_URL:-http://192.168.176.10:8000}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "${SEEDER_PORT:-8010}:8000"
    networks:
      vpngate:
        ipv4_address: 192.168.176.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

networks:
  # Join the vpngate-torrent project's network so "gateway" resolves to the
  # VPN gateway container (which publishes qBittorrent's WebUI).
  vpngate:
    name: vpngate-torrent_default
    external: true
  # No longer used by this service -- registration (which needed IPv6 to
  # reach Cloudflare Turnstile's per-challenge subdomain) moved to the
  # separate plab-register service. Still defined here because the live
  # deployment's docker-compose.override.yml attaches the now-obsolete
  # turnstile-solver sidecar to it; remove this once that override is
  # retired (after plab-register is confirmed working).
  ipv6:
    enable_ipv6: true
